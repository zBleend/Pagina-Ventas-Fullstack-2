<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yorozu 万 / よろず - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/styles-login.css" />
  </head>
  <body class="login-page">
    <header>
      <h1>Yorozu 万 / よろず - Registro de productos</h1>
    </header>

    <main class="login-main">
      <section class="login-section" aria-labelledby="login-title">
        <h2 id="login-title">Iniciar sesión</h2>

        <form id="loginForm" novalidate>
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="cristobal@gmail.com"
            autocomplete="email"
            aria-describedby="error-email"
            required
          />
          <span
            id="error-email"
            class="error-message"
            aria-live="polite"
          ></span>

          <label for="contrasena">Contraseña</label>
          <input
            type="password"
            id="contrasena"
            name="contrasena"
            minlength="8"
            autocomplete="current-password"
            placeholder="Contraseña"
            aria-describedby="error-contrasena"
            required
          />
          <span
            id="error-contrasena"
            class="error-message"
            aria-live="polite"
          ></span>

          <button type="submit">Iniciar sesión</button>
        </form>

        <section class="boton-cuenta-nueva">
          <p>¿No tiene cuenta? ¡Regístrese ahora mismo!</p>
          <a href="registro.html" class="button">Crear cuenta nueva</a>
        </section>
      </section>

      <section class="imagen-portada">
        <img
          src="../assets/images/portada.png"
          alt="Portada de la tienda con productos"
          height="600"
          width="600"
        />
      </section>

      <section class="productos-login">
        <article class="">
          <!-- Producto 1 -->
        </article>
        <article class="">
          <!-- Producto 2 -->
        </article>
      </section>
    </main>

    <footer>
      <a href="index.html">LINK A INDEX TEMPORAL</a>
      <a href="login.html">LINK A LOGIN TEMPORAL</a>
      <p>&copy; Registro de productos - Evaluacion Fullstack II</p>
    </footer>

    <script src="../js/app.js"></script>
    <script src="../js/login.js"></script>
    <script src="../js/transitions.js"></script>
  </body>
</html>
